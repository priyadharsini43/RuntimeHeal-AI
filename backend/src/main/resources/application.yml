server:
  port: ${PORT:8080}

spring:
  application:
    name: RuntimeHeal-AI-Backend
  datasource:
    url: jdbc:h2:file:./data/runtimeheal_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: false

soc:
  operator:
    id: ${SOC_OPERATOR_ID:${RUNTIMEHEAL_ADMIN_USER:admin}}
    passcode: ${SOC_OPERATOR_PASSCODE:${RUNTIMEHEAL_ADMIN_PASSWORD:admin}}

# Spring Boot Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.runtimeheal: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# RuntimeHeal AI provider configuration
runtimeheal:
  ai:
    provider: ${RUNTIMEHEAL_AI_PROVIDER:ollama}
  security:
    enabled: true
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${RUNTIMEHEAL_GROQ_MODEL:}
    base-url: https://api.groq.com/openai/v1
    timeout-seconds: 30
    temperature: 0.1
  ollama:
    base-url: http://localhost:11434
    model: qwen2.5:3b
    timeout-seconds: 120
    temperature: 0.1
    enabled: true
  healing:
    enabled: true
    min-confidence: 0.70
    max-retries: 3
    retry-backoff-ms: 100
    circuit-breaker:
      failure-threshold: 5
      window-seconds: 60
    denylist:
      - "validateAndProcessTransfer"
      - "executeGatewayCall"
